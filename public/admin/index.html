<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spf_Hoang — Quản Trị Viên (Admin Key Panel)</title>
  <style>
    :root {
      --bg: #040d14;
      --card: rgba(8, 28, 42, 0.92);
      --aqua: #00f2fe;
      --aqua-dark: #0077b6;
      --text: #e0fbfc;
      --muted: #8ecae6;
      --danger: #ff4d6d;
      --success: #06d6a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: radial-gradient(circle at top, #0a2538, var(--bg) 75%); color: var(--text); min-height: 100vh; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    .panel { background: var(--card); border: 1px solid rgba(0, 242, 254, 0.35); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 0 16px rgba(0, 242, 254, 0.25); }
    h1 { color: var(--aqua); text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(0, 242, 254, 0.4); background: #020a10; color: var(--aqua); font-size: 0.95rem; margin-bottom: 12px; outline: none; }
    .btn { padding: 12px 16px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, var(--aqua), #00b4d8); color: #021017; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-danger { background: rgba(255, 77, 109, 0.2); color: #ff8fa3; border: 1px solid var(--danger); padding: 7px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .key-item { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px; border-radius: 12px; background: rgba(2, 12, 20, 0.85); border: 1px solid rgba(0, 242, 254, 0.25); margin-bottom: 10px; }
    .key-code { font-family: monospace; font-size: 1.05rem; font-weight: 900; color: var(--aqua); }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.74rem; font-weight: 700; margin-left: 6px; }
    .badge-ok { background: rgba(6, 214, 160, 0.18); color: var(--success); border: 1px solid var(--success); }
    .badge-exp { background: rgba(255, 77, 109, 0.18); color: #ff8fa3; border: 1px solid var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h1>QUẢN TRỊ KEY — SPF_HOANG</h1>
      <p class="sub">Tự động sao lưu chống mất Key • Hỗ trợ xoá Key nhẹ Server</p>

      <!-- Đăng nhập Admin -->
      <div id="loginBox">
        <input type="password" id="adminPass" placeholder="Nhập mật khẩu Admin..." />
        <button class="btn" style="width: 100%;" id="btnLogin">ĐĂNG NHẬP QUẢN TRỊ</button>
        <p id="loginErr" style="color: var(--danger); text-align: center; margin-top: 10px; font-size: 0.88rem;"></p>
      </div>

      <!-- Bảng tạo Key -->
      <div id="adminContent" class="hidden">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label style="font-size: 0.82rem; color: var(--muted);">Thời hạn Key:</label>
            <select id="durationSelect">
              <option value="1h">1 Giờ</option>
              <option value="2h">2 Giờ</option>
              <option value="5h">5 Giờ</option>
              <option value="1d" selected>1 Ngày</option>
              <option value="1w">1 Tuần</option>
              <option value="2w">2 Tuần</option>
              <option value="1m">1 Tháng</option>
              <option value="2m">2 Tháng</option>
              <option value="1y">1 Năm</option>
              <option value="forever">Vĩnh viễn</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.82rem; color: var(--muted);">Ghi chú tên khách (Tuỳ chọn):</label>
            <input type="text" id="noteInput" placeholder="VD: Khách VIP Zalo..." />
          </div>
        </div>
        <button class="btn" style="width: 100%;" id="btnCreateKey">+ TẠO KEY MỚI &amp; SAO CHÉP</button>
        <p id="createStatus" style="color: var(--success); text-align: center; margin-top: 10px; font-weight: 700;"></p>
      </div>
    </div>

    <!-- Danh sách Key -->
    <div id="listPanel" class="panel hidden">
      <div class="toolbar">
        <h3 style="color: var(--aqua);">Danh sách Key (<span id="keyCount">0</span>)</h3>
        <div style="display: flex; gap: 8px;">
          <button class="btn-danger" id="btnCleanupExpired">🧹 Xoá tất cả Key hết hạn</button>
          <button class="btn" style="padding: 7px 12px; font-size: 0.8rem;" id="btnRefresh">🔄 Làm mới</button>
        </div>
      </div>
      <div id="keysContainer"></div>
    </div>
  </div>

  <script>
    let adminToken = localStorage.getItem('spf_admin_token') || '';
    const BACKUP_STORAGE_KEY = 'spf_admin_keys_backup_v1';

    function saveLocalBackup(keysArray) {
      try {
        localStorage.setItem(BACKUP_STORAGE_KEY, JSON.stringify(keysArray));
      } catch {}
    }

    function getLocalBackup() {
      try {
        const raw = localStorage.getItem(BACKUP_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    async function syncBackupToServerIfNeeded() {
      const backup = getLocalBackup();
      if (!backup.length || !adminToken) return;
      try {
        await fetch('/api/admin/sync-restore', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${adminToken}`
          },
          body: JSON.stringify({ backupKeys: backup })
        });
      } catch {}
    }

    async function loadKeys() {
      if (!adminToken) return;
      await syncBackupToServerIfNeeded();

      const res = await fetch('/api/admin/keys', {
        headers: { Authorization: `Bearer ${adminToken}` }
      });
      if (res.status === 401) {
        localStorage.removeItem('spf_admin_token');
        location.reload();
        return;
      }
      const data = await res.json();
      if (!data.success) return;

      saveLocalBackup(data.keys);
      document.getElementById('keyCount').textContent = data.keys.length;
      const box = document.getElementById('keysContainer');
      box.innerHTML = '';

      if (data.keys.length === 0) {
        box.innerHTML = '<p style="color: var(--muted); text-align:center; padding: 14px;">Chưa có Key nào trong hệ thống.</p>';
        return;
      }

      data.keys.forEach(item => {
        const div = document.createElement('div');
        div.className = 'key-item';
        const expText = item.expiresAt ? new Date(item.expiresAt).toLocaleString('vi-VN') : 'Vĩnh viễn';
        const deviceInfo = item.boundDeviceId
          ? `🔒 Đã khoá: ${item.boundDeviceName} (${item.boundDeviceId})`
          : '🔓 Chưa kích hoạt thiết bị';

        div.innerHTML = `
          <div>
            <div>
              <span class="key-code">${item.key}</span>
              <span class="badge ${item.isExpired ? 'badge-exp' : 'badge-ok'}">
                ${item.isExpired ? 'Đã hết hạn' : item.durationLabel}
              </span>
            </div>
            <div style="font-size: 0.78rem; color: var(--muted); margin-top: 4px;">
              Hết hạn: ${expText} • ${deviceInfo} ${item.note ? `• Ghi chú: <b>${item.note}</b>` : ''}
            </div>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="btn" style="padding: 7px 10px; font-size: 0.78rem;" onclick="copyKey('${item.key}')">📋 Copy</button>
            <button class="btn-danger" onclick="deleteSingleKey('${item.key}')">🗑️ Xoá</button>
          </div>
        `;
        box.appendChild(div);
      });
    }

    window.copyKey = function (k) {
      navigator.clipboard.writeText(k);
      alert('Đã sao chép Key: ' + k);
    };

    window.deleteSingleKey = async function (k) {
      if (!confirm(`Bạn có chắc muốn XOÁ vĩnh viễn Key ${k} khỏi Server?`)) return;
      // Xoá khỏi cả bản backup trên trình duyệt
      const currentBackup = getLocalBackup().filter(x => x.key !== k);
      saveLocalBackup(currentBackup);

      const res = await fetch(`/api/admin/keys/${encodeURIComponent(k)}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${adminToken}` }
      });
      const data = await res.json();
      if (data.success) loadKeys();
    };

    document.getElementById('btnCleanupExpired').addEventListener('click', async () => {
      if (!confirm('Xoá toàn bộ các Key đã hết hạn để nhẹ Server?')) return;
      const now = Date.now();
      const filteredBackup = getLocalBackup().filter(x => !x.expiresAt || x.expiresAt > now);
      saveLocalBackup(filteredBackup);

      const res = await fetch('/api/admin/cleanup-expired', {
        method: 'POST',
        headers: { Authorization: `Bearer ${adminToken}` }
      });
      const data = await res.json();
      alert(data.message || 'Đã dọn dẹp!');
      loadKeys();
    });

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const password = document.getElementById('adminPass').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (!data.success) {
        document.getElementById('loginErr').textContent = data.message;
        return;
      }
      adminToken = data.token;
      localStorage.setItem('spf_admin_token', adminToken);
      showAdminView();
    });

    document.getElementById('btnCreateKey').addEventListener('click', async () => {
      const durationCode = document.getElementById('durationSelect').value;
      const note = document.getElementById('noteInput').value;
      const res = await fetch('/api/admin/generate-key', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${adminToken}`
        },
        body: JSON.stringify({ durationCode, note })
      });
      const data = await res.json();
      if (data.success) {
        navigator.clipboard.writeText(data.keyData.key).catch(() => {});
        document.getElementById('createStatus').textContent = `✔ Đã tạo & Copy Key: ${data.keyData.key}`;
        document.getElementById('noteInput').value = '';
        loadKeys();
      }
    });

    document.getElementById('btnRefresh').addEventListener('click', loadKeys);

    function showAdminView() {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
      document.getElementById('listPanel').classList.remove('hidden');
      loadKeys();
    }

    if (adminToken) showAdminView();

    // Tự động ping giữ server thức mỗi 5 phút
    setInterval(() => fetch('/api/ping').catch(() => {}), 300000);
  </script>
</body>
</html>
