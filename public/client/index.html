<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spf_Hoang — Gaming Control Panel VIP</title>
  <style>
    :root {
      --bg-dark: #040d14;
      --bg-card: rgba(8, 28, 42, 0.88);
      --aqua-primary: #00f2fe;
      --aqua-secondary: #00b4d8;
      --aqua-deep: #0077b6;
      --text-main: #e0fbfc;
      --text-muted: #8ecae6;
      --danger: #ff4d6d;
      --success: #06d6a0;
      --border-glow: 0 0 14px rgba(0, 242, 254, 0.38);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at top, #0a2538 0%, var(--bg-dark) 75%); color: var(--text-main); min-height: 100vh; padding: 14px; }
    .app-container { max-width: 760px; margin: 0 auto; }
    .brand-header { text-align: center; padding: 20px 12px; margin-bottom: 16px; border-radius: 18px; background: linear-gradient(145deg, rgba(0, 180, 216, 0.16), rgba(4, 13, 20, 0.94)); border: 1px solid rgba(0, 242, 254, 0.38); box-shadow: var(--border-glow); }
    .brand-title { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #fff, var(--aqua-primary), var(--aqua-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sim-badge { display: inline-block; margin-top: 8px; padding: 4px 12px; font-size: 0.78rem; border-radius: 999px; background: rgba(0, 242, 254, 0.12); border: 1px solid rgba(0, 242, 254, 0.4); color: var(--aqua-primary); }
    .glass-panel { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid rgba(0, 242, 254, 0.28); border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), var(--border-glow); margin-bottom: 16px; }
    .section-title { font-size: 1rem; font-weight: 800; color: var(--aqua-primary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; }
    .contact-grid, .features-grid, .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 580px) { .contact-grid, .features-grid, .game-grid { grid-template-columns: 1fr; } }
    .btn-action { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; padding: 14px 16px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; color: #021017; background: linear-gradient(135deg, var(--aqua-primary), var(--aqua-secondary)); box-shadow: 0 0 16px rgba(0, 242, 254, 0.45); border: none; cursor: pointer; transition: 0.2s; text-align: center; }
    .btn-action:active { transform: scale(0.98); }
    .btn-subtext { font-size: 0.78rem; margin-top: 4px; color: #032b3a; font-weight: 600; }
    .free-key-banner { text-align: center; padding: 10px; margin: 14px 0; border-radius: 10px; background: rgba(0, 242, 254, 0.1); border: 1px dashed var(--aqua-primary); color: #fff; font-weight: 700; }
    .input-cyber { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(0, 242, 254, 0.45); background: rgba(2, 12, 20, 0.9); color: var(--aqua-primary); font-size: 1rem; font-weight: 600; text-align: center; outline: none; margin-bottom: 12px; }
    .status-box { padding: 12px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; text-align: center; display: none; margin-top: 12px; }
    .status-loading { display: block; background: rgba(0, 180, 216, 0.18); border: 1px solid var(--aqua-secondary); color: var(--aqua-primary); }
    .status-error { display: block; background: rgba(255, 77, 109, 0.16); border: 1px solid var(--danger); color: #ff8fa3; }
    .status-success { display: block; background: rgba(6, 214, 160, 0.16); border: 1px solid var(--success); color: #52f2c2; }
    .btn-outline { background: rgba(0, 242, 254, 0.08); color: var(--aqua-primary); border: 1px solid rgba(0, 242, 254, 0.45); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.82rem; }
    .hidden { display: none !important; }
    .session-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; padding: 12px 16px; border-radius: 12px; background: rgba(0, 119, 182, 0.22); border: 1px solid rgba(0, 242, 254, 0.35); font-size: 0.86rem; }
    .preset-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .feature-card { background: rgba(6, 22, 34, 0.9); border: 1px solid rgba(0, 242, 254, 0.22); border-radius: 14px; padding: 14px; transition: 0.2s; }
    .feature-card.active { border-color: var(--aqua-primary); box-shadow: 0 0 16px rgba(0, 242, 254, 0.35); background: linear-gradient(160deg, rgba(0, 180, 216, 0.16), rgba(6, 22, 34, 0.95)); }
    .feature-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .feature-title-wrap { display: flex; align-items: center; gap: 10px; }
    .feature-icon { width: 34px; height: 34px; border-radius: 8px; background: rgba(0, 242, 254, 0.14); border: 1px solid rgba(0, 242, 254, 0.4); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .feature-name { font-weight: 700; font-size: 0.96rem; color: #fff; }
    .feature-state-tag { font-size: 0.75rem; display: block; color: var(--text-muted); margin-top: 2px; }
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; inset: 0; background-color: #122a3a; border: 1px solid rgba(0, 242, 254, 0.35); transition: 0.25s; border-radius: 34px; }
    .slider-toggle:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: 0.25s; border-radius: 50%; }
    input:checked + .slider-toggle { background: linear-gradient(90deg, var(--aqua-deep), var(--aqua-primary)); box-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }
    input:checked + .slider-toggle:before { transform: translateX(22px); background-color: #021017; }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .cyber-range { flex: 1; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px; background: #0d2535; border: 1px solid rgba(0, 242, 254, 0.3); outline: none; }
    .cyber-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--aqua-primary); box-shadow: 0 0 10px var(--aqua-primary); cursor: pointer; border: 2px solid #fff; }
    .range-value { min-width: 38px; text-align: right; font-weight: 800; color: var(--aqua-primary); font-size: 0.92rem; }
    .game-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(8, 28, 42, 0.9); border: 1px solid rgba(0, 242, 254, 0.4); color: var(--text-main); cursor: pointer; text-align: left; }
    .game-icon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--aqua-primary), var(--aqua-deep)); color: #021017; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="brand-header">
      <h1 class="brand-title">Spf_Hoang</h1>
      <span class="sim-badge"></span>
    </header>

    <!-- TRANG 1: NHẬP KEY -->
    <section id="pageKeyAuth" class="glass-panel">
      <div class="contact-grid">
        <a href="https://zalo.me/g/ksgk8apm4fjloxyhvh39" target="_blank" rel="noopener noreferrer" class="btn-action">
          <span>BOX ZALO</span>
          <span class="btn-subtext">Tham gia cộng đồng nhận hỗ trợ</span>
        </a>
        <a href="https://zalo.me/84788686079" target="_blank" rel="noopener noreferrer" class="btn-action">
          <span>📞LIÊN HỆ ADMIN QUANG HOANG</span>
          <span class="btn-subtext">Zalo: 0788686079</span>
        </a>
      </div>

      <div class="free-key-banner">Vào box nhận key FREE</div>

      <form id="keyForm">
        <input type="text" id="keyInput" class="input-cyber" placeholder="Nhập mã Key của bạn (VD: SPF-XXXXXX-XXXXXX-XXXXXX)" autocomplete="off" required />
        <button type="submit" id="btnSubmitKey" class="btn-action" style="width: 100%;">XÁC NHẬN &amp; TRUY CẬP</button>
      </form>
      <div id="authStatusBox" class="status-box"></div>
    </section>

    <!-- TRANG 2: BẢNG ĐIỀU KHIỂN CHÍNH -->
    <section id="pageDashboard" class="hidden" style="display: none;">
      <div class="session-bar">
        <div>
          <strong>Key:</strong> <span id="sessionKeyText" style="color: var(--aqua-primary);"></span>
          <span id="sessionExpiryText" style="color: var(--text-muted); margin-left: 6px;"></span>
        </div>
        <button type="button" id="btnLogout" class="btn-outline">Đổi Key / Đăng xuất</button>
      </div>

      <div class="preset-bar">
        <button type="button" class="btn-outline" onclick="applyQuickPreset('vip')">🔥 Bật Full VIP (100%)</button>
        <button type="button" class="btn-outline" onclick="applyQuickPreset('pro')">🎯 Chuẩn Kéo Đầm (85%)</button>
        <button type="button" class="btn-outline" onclick="applyQuickPreset('reset')">🔄 Mặc định</button>
      </div>

      <div id="featuresContainer" class="features-grid" style="margin-bottom: 16px;"></div>

      <div class="glass-panel">
        <div class="section-title">
          <span>🚀 Optimizer &amp; Độ Nhạy</span>
          <span id="optimizerValueDisplay">95%</span>
        </div>

        <div style="margin-bottom: 14px;">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:6px;">
            <span><strong>Optimizer (Hiệu Năng Cao):</strong></span>
            <span id="optSubVal" style="color:var(--aqua-primary); font-weight:800;">95%</span>
          </div>
          <input type="range" id="optimizerSlider" class="cyber-range" style="width:100%;" min="0" max="100" value="95" />
        </div>

        <div style="margin-bottom: 14px;">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:6px;">
            <span><strong>Lực Hút Headshot:</strong></span>
            <span id="hsPowerVal" style="color:var(--aqua-primary); font-weight:800;">95%</span>
          </div>
          <input type="range" id="hsPowerSlider" class="cyber-range" style="width:100%;" min="0" max="100" value="95" />
        </div>

        <div style="margin-bottom: 14px;">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:6px;">
            <span><strong>DPI Cảm ứng:</strong></span>
            <span id="dpiVal" style="color:var(--aqua-primary); font-weight:800;">960 DPI</span>
          </div>
          <input type="range" id="dpiSlider" class="cyber-range" style="width:100%;" min="400" max="1440" step="20" value="960" />
        </div>

        <button type="button" id="btnApplyAll" class="btn-action" style="width: 100%;">
          ⚡ LƯU &amp; ÁP DỤNG CẤU HÌNH VÀO GAME
        </button>
        <div id="applyStatusBox" class="status-box"></div>
      </div>

      <div class="glass-panel">
        <div class="section-title"><span>🎮 Vào Thẳng Game</span></div>
        <div class="game-grid">
          <button type="button" class="game-card" id="btnLaunchFFNormal">
            <div class="game-icon">FF</div>
            <div>
              <div style="font-weight: 800;">FreeFire Thường</div>
              <div style="font-size: 0.76rem; color: var(--text-muted);">Áp dụng &amp; Mở Game</div>
            </div>
          </button>

          <button type="button" class="game-card" id="btnLaunchFFMax">
            <div class="game-icon">MAX</div>
            <div>
              <div style="font-weight: 800;">FreeFireMax</div>
              <div style="font-size: 0.76rem; color: var(--text-muted);">Áp dụng &amp; Mở Game</div>
            </div>
          </button>
        </div>
        <div id="gameLaunchMessage" class="status-box"></div>
      </div>
    </section>
  </div>

  <script>
    const CLIENT_SESSION_STORAGE_KEY = 'spf_saved_client_session_v2';

    // KHO DỮ LIỆU GẮN NGẦM TỪNG TỆP HEX THEO ĐÚNG CHỨC NĂNG (ẨN TRÊN GIAO DIỆN)
    const SILENT_FEATURE_HEX_BINDINGS = Object.freeze({
      // 1. Nhẹ Tâm: NHE_TAM_VIP.hex.txt + nhẹ_tâm-1.hex.txt + nhe_tam_khong_lo_khong_rung.hex.txt
      nhe_tam: {
        files: [
          'NHE_TAM_VIP.hex.txt',
          'nhẹ_tâm-1.hex.txt',
          'nhe_tam_khong_lo_khong_rung.hex.txt'
        ],
        coreKeys: [
          'com.apple.lightaim.enable=true',
          'com.apple.lightaim.target.zone=head',
          'com.apple.lightaim.lock.type=soft_lock',
          'com.apple.lightaim.conflict.resolver.priority=headshot_first',
          'com.dragsoft.gentouch',
          'com.headstop.autobalance',
          'com.recoil.stopshake',
          'com.norecoil.pointstop',
          'com.tamfix.autobalancer',
          'com.sentov-ffxbase64.list',
          'com.system-touchdelay-0.ips',
          'com.touch'
        ]
      },

      // 2. Bám Đầu: BAT_TAM_VIP.hex.txt + ghìm chặt ss3 2.hex + BAM DAU VIP.txt
      bam_dau: {
        files: [
          'BAT_TAM_VIP.hex.txt',
          'ghìm chặt ss3 2.hex',
          'BAM DAU VIP.txt'
        ],
        coreKeys: [
          'com.apple.centerlock.enable=true',
          'com.apple.centerlock.lock.type=hard_lock',
          'com.apple.centerlock.snap.intensity=high',
          'com.apple.centerlock.track.speed=2.0',
          'com.apple.centerlock.gyro.smoothing.algorithm=kalman',
          'com.apple.centerlock.conflict.resolver.priority=centered_aim_first'
        ]
      },

      // 3. Tăng Nhạy: 01_tang_nhay_man_hinh.hex.txt + Nhay_x18_Supper_Ver_10.hex
      tang_nhay: {
        files: [
          '01_tang_nhay_man_hinh.hex.txt',
          'Nhay_x18_Supper_Ver_10.hex',
          'Sensi1_1.txt',
          'Sensi2_1.txt'
        ],
        coreKeys: [
          'com.touchboost.levelup',
          'com.screenreact.fasttouch',
          'com.sensitivity.core',
          'com.screendelay.remove',
          'com.touchrespond.optimizer',
          'com.quickreaction.speed',
          'com.latency.dropper',
          'com.sensifix.engine'
        ]
      },

      // 4. AimLock: aimlock_90phantram.hex.txt + Aimlock Ver 11.hex + Aimlock_code.hex.txt
      aim_lock: {
        files: [
          'aimlock_90phantram.hex.txt',
          'Aimlock Ver 11.hex',
          'Aimlock_code.hex.txt',
          'Aimlock___ghim_tam__1_.hex.txt'
        ],
        coreKeys: [
          'com.sentov-ffxbase64.list',
          'com.system-touchdelay-0.ips',
          'com.fom3dtouch.dat',
          'com.systemfarm_rate-120Hz-on.apk',
          'com.flexmaxsetting-dpi4400system.on',
          'com.3dtouch.all',
          'com.gboardpointerspeed.full',
          'com.ios'
        ]
      },

      // 5. Optimizer & Fix Lag: FIX_LAG_VIP.hex.txt + Hiệu Năng Cao Ss2 2.hex + 28 tệp cấu hình
      optimizer_pack: {
        files: [
          'FIX_LAG_VIP.hex.txt',
          'Hiệu Năng Cao Ss2 2.hex',
          'config_toi_uu_ffth___ffmax.hex.txt',
          'toi_uu_hieu_nang_adr_thap.hex.txt',
          'Giam_lag__1_.hex.txt'
        ],
        coreKeys: [
          'com.apple.network.optimization=true',
          'com.apple.network.low.latency=true',
          'com.apple.game.performance.optimization=true',
          'com.apple.game.max.frame.rate=144',
          'com.apple.screen.response.time=0.001',
          'com.apple.screen.refresh.rate=144'
        ]
      }
    });

    const FEATURE_DEFINITIONS = [
      { id: 'nhe_tam', name: 'Nhẹ Tâm', icon: '🎯' },
      { id: 'tang_nhay', name: 'Tăng Nhạy (x18)', icon: '⚡' },
      { id: 'buff_man', name: 'Buff Màn', icon: '📱' },
      { id: 'aim_lock', name: 'AimLock', icon: '🔒' },
      { id: 'head_lock', name: 'HeadLock ☠️', icon: '👑' },
      { id: 'bam_dau', name: 'Bám Đầu (Ghìm Chặt)', icon: '🧲' },
      { id: 'dam_tam', name: 'Đầm Tâm', icon: '🛡️' },
      { id: 'fix_rung', name: 'Fix Rung Đầu', icon: '🎛️' }
    ];

    const appState = {
      sessionToken: null,
      keyInfo: null,
      optimizer: 95,
      headshotPower: 95,
      dpi: 960,
      features: {}
    };

    FEATURE_DEFINITIONS.forEach(item => {
      appState.features[item.id] = { enabled: true, value: 90 };
    });

    function getDeviceIdentity() {
      let savedId = '';
      try {
        savedId = localStorage.getItem('spf_unique_device_id') || '';
        if (!savedId) {
          const raw = [navigator.platform, screen.width + 'x' + screen.height, Date.now()].join('|');
          let hash = 0;
          for (let i = 0; i < raw.length; i++) hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
          savedId = 'DEV-' + Math.abs(hash).toString(16).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
          localStorage.setItem('spf_unique_device_id', savedId);
        }
      } catch (e) {
        savedId = 'DEV-MOBILE-DEFAULT';
      }
      const ua = navigator.userAgent || '';
      let deviceName = 'Máy tính (PC)';
      if (/iPhone/i.test(ua)) deviceName = 'iPhone (iOS)';
      else if (/iPad/i.test(ua)) deviceName = 'iPad (iOS)';
      else if (/Android/i.test(ua)) deviceName = 'Điện thoại Android';
      return { deviceId: savedId, deviceName };
    }

    const pageKeyAuth = document.getElementById('pageKeyAuth');
    const pageDashboard = document.getElementById('pageDashboard');
    const authStatusBox = document.getElementById('authStatusBox');
    const featuresContainer = document.getElementById('featuresContainer');
    const optimizerSlider = document.getElementById('optimizerSlider');
    const optimizerValueDisplay = document.getElementById('optimizerValueDisplay');
    const optSubVal = document.getElementById('optSubVal');

    function showStatus(el, type, text) {
      el.className = `status-box status-${type}`;
      el.style.display = 'block';
      el.textContent = text;
    }

    function saveClientSessionToStorage() {
      if (!appState.sessionToken || !appState.keyInfo) return;
      try {
        localStorage.setItem(
          CLIENT_SESSION_STORAGE_KEY,
          JSON.stringify({
            sessionToken: appState.sessionToken,
            keyInfo: appState.keyInfo,
            optimizer: appState.optimizer,
            headshotPower: appState.headshotPower,
            dpi: appState.dpi,
            features: appState.features
          })
        );
      } catch (e) {}
    }

    function clearClientSessionFromStorage() {
      try {
        localStorage.removeItem(CLIENT_SESSION_STORAGE_KEY);
      } catch (e) {}
    }

    function forceLogoutToKeyScreen(reasonMessage) {
      appState.sessionToken = null;
      appState.keyInfo = null;
      clearClientSessionFromStorage();

      pageDashboard.classList.add('hidden');
      pageDashboard.style.display = 'none';
      pageKeyAuth.classList.remove('hidden');
      pageKeyAuth.style.display = 'block';

      if (reasonMessage) {
        showStatus(authStatusBox, 'error', reasonMessage);
      }
    }

    function renderFeatureCards() {
      featuresContainer.innerHTML = '';
      FEATURE_DEFINITIONS.forEach(def => {
        const cur = appState.features[def.id] || { enabled: true, value: 90 };
        const card = document.createElement('div');
        card.className = `feature-card ${cur.enabled ? 'active' : ''}`;
        card.id = `card_${def.id}`;
        card.innerHTML = `
          <div class="feature-top">
            <div class="feature-title-wrap">
              <div class="feature-icon">${def.icon}</div>
              <div>
                <div class="feature-name">${def.name}</div>
                <span class="feature-state-tag" id="tag_${def.id}">
                  ${cur.enabled ? 'Đang bật' : 'Đang tắt'}
                </span>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" data-feature-toggle="${def.id}" ${cur.enabled ? 'checked' : ''} />
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="range-row">
            <input type="range" class="cyber-range" min="0" max="100" value="${cur.value}" data-feature-slider="${def.id}" />
            <span class="range-value" id="val_${def.id}">${cur.value}%</span>
          </div>
        `;
        featuresContainer.appendChild(card);
      });

      document.querySelectorAll('[data-feature-toggle]').forEach(t => {
        t.addEventListener('change', e => {
          const id = e.target.getAttribute('data-feature-toggle');
          const en = e.target.checked;
          appState.features[id].enabled = en;
          document.getElementById(`card_${id}`).classList.toggle('active', en);
          document.getElementById(`tag_${id}`).textContent = en ? 'Đang bật' : 'Đang tắt';
          persistConfiguration();
        });
      });

      document.querySelectorAll('[data-feature-slider]').forEach(s => {
        s.addEventListener('input', e => {
          const id = e.target.getAttribute('data-feature-slider');
          const v = Number(e.target.value);
          appState.features[id].value = v;
          document.getElementById(`val_${id}`).textContent = v + '%';
        });
        s.addEventListener('change', () => persistConfiguration());
      });
    }

    window.applyQuickPreset = function (type) {
      FEATURE_DEFINITIONS.forEach(d => {
        if (type === 'vip') {
          appState.features[d.id] = { enabled: true, value: 100 };
          appState.optimizer = 100;
          appState.headshotPower = 100;
        } else if (type === 'pro') {
          appState.features[d.id] = { enabled: true, value: 85 };
          appState.optimizer = 95;
          appState.headshotPower = 92;
        } else {
          appState.features[d.id] = { enabled: false, value: 50 };
          appState.optimizer = 50;
          appState.headshotPower = 50;
        }
      });
      optimizerSlider.value = appState.optimizer;
      optimizerValueDisplay.textContent = appState.optimizer + '%';
      optSubVal.textContent = appState.optimizer + '%';
      document.getElementById('hsPowerSlider').value = appState.headshotPower;
      document.getElementById('hsPowerVal').textContent = appState.headshotPower + '%';
      renderFeatureCards();
      persistConfiguration();
    };

    document.getElementById('hsPowerSlider').addEventListener('input', e => {
      appState.headshotPower = Number(e.target.value);
      document.getElementById('hsPowerVal').textContent = appState.headshotPower + '%';
    });
    document.getElementById('hsPowerSlider').addEventListener('change', () => persistConfiguration());

    document.getElementById('dpiSlider').addEventListener('input', e => {
      appState.dpi = Number(e.target.value);
      document.getElementById('dpiVal').textContent = appState.dpi + ' DPI';
    });
    document.getElementById('dpiSlider').addEventListener('change', () => persistConfiguration());

    optimizerSlider.addEventListener('input', e => {
      appState.optimizer = Number(e.target.value);
      optimizerValueDisplay.textContent = appState.optimizer + '%';
      optSubVal.textContent = appState.optimizer + '%';
    });
    optimizerSlider.addEventListener('change', () => persistConfiguration());

    async function persistConfiguration() {
      saveClientSessionToStorage();
      if (!appState.sessionToken) return;
      try {
        await fetch('/api/client/config', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${appState.sessionToken}`
          },
          body: JSON.stringify({
            features: {
              ...appState.features,
              _bgSettings: {
                power: appState.headshotPower,
                dpi: appState.dpi,
                silentHexBindings: {
                  nhe_tam: appState.features.nhe_tam.enabled ? SILENT_FEATURE_HEX_BINDINGS.nhe_tam.files : [],
                  bam_dau: appState.features.bam_dau.enabled ? SILENT_FEATURE_HEX_BINDINGS.bam_dau.files : [],
                  tang_nhay: appState.features.tang_nhay.enabled ? SILENT_FEATURE_HEX_BINDINGS.tang_nhay.files : [],
                  aim_lock: appState.features.aim_lock.enabled ? SILENT_FEATURE_HEX_BINDINGS.aim_lock.files : [],
                  optimizer: SILENT_FEATURE_HEX_BINDINGS.optimizer_pack.files
                }
              }
            },
            optimizer: appState.optimizer
          })
        });
      } catch (e) {}
    }

    document.getElementById('btnApplyAll').addEventListener('click', async () => {
      const box = document.getElementById('applyStatusBox');
      showStatus(box, 'loading', 'Đang lưu và áp dụng cấu hình...');
      await persistConfiguration();
      setTimeout(() => {
        showStatus(box, 'success', '✔ Đã áp dụng toàn bộ cấu hình! Hãy bấm chọn FreeFire bên dưới để vào thẳng game.');
      }, 300);
    });

    function openDashboardView() {
      pageKeyAuth.classList.add('hidden');
      pageKeyAuth.style.display = 'none';

      pageDashboard.classList.remove('hidden');
      pageDashboard.style.display = 'block';

      if (appState.keyInfo) {
        document.getElementById('sessionKeyText').textContent = `${appState.keyInfo.key} (${appState.keyInfo.durationLabel || 'VIP'})`;
        document.getElementById('sessionExpiryText').textContent = appState.keyInfo.expiresAt
          ? `• Hết hạn: ${new Date(appState.keyInfo.expiresAt).toLocaleString('vi-VN')}`
          : '• Vĩnh viễn';
      }
      optimizerSlider.value = appState.optimizer;
      optimizerValueDisplay.textContent = appState.optimizer + '%';
      optSubVal.textContent = appState.optimizer + '%';
      document.getElementById('hsPowerSlider').value = appState.headshotPower;
      document.getElementById('hsPowerVal').textContent = appState.headshotPower + '%';
      document.getElementById('dpiSlider').value = appState.dpi;
      document.getElementById('dpiVal').textContent = appState.dpi + ' DPI';
      renderFeatureCards();
    }

    function applyServerDataToState(rawKey, data) {
      appState.sessionToken = data.sessionToken || rawKey;
      appState.keyInfo = data.keyInfo || { key: rawKey, durationLabel: 'VIP' };

      if (data.savedConfig && data.savedConfig.features) {
        const { _bgSettings, ...rest } = data.savedConfig.features;
        FEATURE_DEFINITIONS.forEach(d => {
          if (rest[d.id] && typeof rest[d.id] === 'object') {
            appState.features[d.id] = {
              enabled: Boolean(rest[d.id].enabled),
              value: Number(rest[d.id].value ?? 90)
            };
          }
        });
        if (_bgSettings) {
          appState.headshotPower = Number(_bgSettings.power ?? 95);
          appState.dpi = Number(_bgSettings.dpi ?? 960);
        }
        if (typeof data.savedConfig.optimizer === 'number') {
          appState.optimizer = data.savedConfig.optimizer;
        }
      }
      saveClientSessionToStorage();
    }

    async function restoreSavedSessionOnLoad() {
      try {
        const raw = localStorage.getItem(CLIENT_SESSION_STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !saved.keyInfo || !saved.keyInfo.key) return;

        if (saved.keyInfo.expiresAt && Date.now() > saved.keyInfo.expiresAt) {
          forceLogoutToKeyScreen('Mã Key của bạn đã hết thời gian sử dụng. Vui lòng nhập Key mới!');
          return;
        }

        appState.sessionToken = saved.sessionToken || saved.keyInfo.key;
        appState.keyInfo = saved.keyInfo;
        if (typeof saved.optimizer === 'number') appState.optimizer = saved.optimizer;
        if (typeof saved.headshotPower === 'number') appState.headshotPower = saved.headshotPower;
        if (typeof saved.dpi === 'number') appState.dpi = saved.dpi;
        if (saved.features) Object.assign(appState.features, saved.features);

        openDashboardView();

        const { deviceId, deviceName } = getDeviceIdentity();
        const res = await fetch('/api/client/verify-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: saved.keyInfo.key, deviceId, deviceName })
        });
        const data = await res.json();

        if (res.status === 403 || (data && data.success === false)) {
          forceLogoutToKeyScreen(data.message || 'Key đã hết hạn hoặc bị huỷ.');
          return;
        }

        if (res.ok && data.success) {
          if (saved.keyInfo.expiresAt && data.keyInfo) {
            data.keyInfo.expiresAt = Math.min(saved.keyInfo.expiresAt, data.keyInfo.expiresAt || saved.keyInfo.expiresAt);
          }
          applyServerDataToState(saved.keyInfo.key, data);
          openDashboardView();
        }
      } catch (e) {}
    }

    document.getElementById('keyForm').addEventListener('submit', async e => {
      e.preventDefault();
      const rawKey = document.getElementById('keyInput').value.trim().toUpperCase();
      if (!rawKey) {
        showStatus(authStatusBox, 'error', 'Vui lòng nhập mã Key!');
        return;
      }

      const { deviceId, deviceName } = getDeviceIdentity();
      showStatus(authStatusBox, 'loading', 'Đang kiểm tra Key...');

      try {
        const res = await fetch('/api/client/verify-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: rawKey, deviceId, deviceName })
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          showStatus(authStatusBox, 'error', data.message || 'Key không hợp lệ hoặc đã hết hạn.');
          return;
        }

        applyServerDataToState(rawKey, data);
        showStatus(authStatusBox, 'success', '✔ Xác thực thành công! Đang vào trang...');
        openDashboardView();
      } catch (err) {
        showStatus(authStatusBox, 'error', 'Lỗi kết nối máy chủ. Hãy tải lại trang và thử lại!');
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      forceLogoutToKeyScreen('');
      authStatusBox.style.display = 'none';
    });

    function handleGameSelection(gameType) {
      const msgBox = document.getElementById('gameLaunchMessage');
      const ua = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);

      const gameConfig = {
        normal: {
          name: 'FreeFire Thường',
          iosScheme: 'freefireth://',
          iosStore: 'https://apps.apple.com/vn/app/id1300146617',
          androidIntent: 'intent://#Intent;scheme=freefire;package=com.dts.freefireth;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.dts.freefireth;end'
        },
        max: {
          name: 'FreeFireMax',
          iosScheme: 'freefiremax://',
          iosStore: 'https://apps.apple.com/vn/app/id1480516829',
          androidIntent: 'intent://#Intent;scheme=freefiremax;package=com.dts.freefiremax;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.dts.freefiremax;end'
        }
      };

      const target = gameConfig[gameType];
      persistConfiguration();

      if (isIOS) {
        showStatus(msgBox, 'loading', `Đang áp dụng cấu hình và mở ${target.name}...`);
        window.location.href = target.iosScheme;
        setTimeout(() => {
          if (!document.hidden) window.location.href = target.iosStore;
        }, 2500);
      } else if (isAndroid) {
        showStatus(msgBox, 'loading', `Đang áp dụng cấu hình và mở ${target.name}...`);
        window.location.href = target.androidIntent;
      } else {
        showStatus(msgBox, 'success', `Đã lưu & áp dụng cấu hình! Hãy mở trên điện thoại để vào thẳng ${target.name}.`);
      }
    }

    document.getElementById('btnLaunchFFNormal').addEventListener('click', () => handleGameSelection('normal'));
    document.getElementById('btnLaunchFFMax').addEventListener('click', () => handleGameSelection('max'));

    setInterval(() => {
      if (appState.keyInfo && appState.keyInfo.expiresAt && Date.now() > appState.keyInfo.expiresAt) {
        forceLogoutToKeyScreen('Mã Key của bạn vừa hết thời gian sử dụng!');
      }
    }, 10000);

    restoreSavedSessionOnLoad();
    setInterval(() => fetch('/api/ping').catch(() => {}), 300000);
  </script>
</body>
</html>
